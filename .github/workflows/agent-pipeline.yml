name: Agent Pipeline

on:
  pull_request:
  push:
    paths:
      - 'agentes/**'

jobs:
  validate-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run reviewer+tester on new agents
        run: |
          echo "Looking for new agent files..."
          AGENT_FILES=$(git diff --name-only ${{ github.sha }} ${{ github.event.before }} | grep '^agentes/.*\.py' || true)
          if [ -z "$AGENT_FILES" ]; then
            echo "No agent files changed; scanning agentes/ for new files"
            AGENT_FILES=$(git ls-files agentes/*.py || true)
          fi
          echo "Agent files: $AGENT_FILES"
          # run simple import test for each agent file
          for f in $AGENT_FILES; do
            echo "Testing $f"
            python - <<PY
import importlib.util,sys
spec=importlib.util.spec_from_file_location('mod', '$f')
mod=importlib.util.module_from_spec(spec)
spec.loader.exec_module(mod)
print('Imported', '$f')
PY
          done
