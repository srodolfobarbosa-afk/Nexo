name: Nexo Motor 24h

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */1 * * *'

permissions:
  contents: write

jobs:
  motor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          pip install -r requirements_final.txt 2>/dev/null || pip install -r requirements.txt 2>/dev/null || pip install requests pymongo python-dotenv -q
          ls -la main_autonomo_final.py || echo "SEM main_autonomo_final.py"

      - name: Rodar motor
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          META_API_KEY: ${{ secrets.META_API_KEY }}
        run: |
          python main_autonomo_final.py || echo "motor rodou com fallback"
          ls -la nexo_cerebro_vivo_*.md nexo_space/ 2>/dev/null || true

      - name: Push autonomo
        run: |
          git config user.name "nexo-bot"
          git config user.email "bot@nexo.local"
          git add -A || true
          git diff --cached --quiet && echo "nada pra commitar" && exit 0
          git commit -m "auto: ciclo $(date -u +%Y%m%d-%H%M) [skip ci]" || exit 0
          git push || git push origin HEAD:main
