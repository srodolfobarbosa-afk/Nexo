name: Nexo Motor 24h - Cerebro Digital
on:
  schedule:
      - cron: '0 */1 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'nexo_comunicacao/meta_para_braco.md'
permissions:
  contents: write
jobs:
  cerebro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests -q
      - run: python nexo_brain/cerebro.py
      - run: |
          git config user.name "nexo-cerebro"
          git config user.email "cerebro@colunadocr.local"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "🧠 auto-evolucao $(date -u +%H%M) [skip ci]"
          git push
