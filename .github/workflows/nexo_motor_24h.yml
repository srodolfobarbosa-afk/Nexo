name: Nexo Motor 24h - Cerebro Digital

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'nexo_comunicacao/meta_para_braco.md'

permissions:
  contents: write

jobs:
  cerebro:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install requests -q

      - name: Executar motor
        run: python nexo_brain/cerebro.py

      - name: Publicar resultados
        run: |
          set -e
          git config user.name "nexo-cerebro"
          git config user.email "cerebro@colunadocr.local"
          git pull --rebase origin "${GITHUB_REF#refs/heads/}" || true
          git add -A
          if git diff --cached --quiet; then
            echo "Nada novo para publicar"
            exit 0
          fi
          git commit -m "🧠 auto-evolucao $(date -u +%H%M) [skip ci]"
          git push origin HEAD:${GITHUB_REF#refs/heads/}
