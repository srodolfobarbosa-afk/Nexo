name: AutoConstructor Runner

on:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours
  workflow_dispatch:

jobs:
  run-autoconstructor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r autoconstructor/requirements.txt

      - name: Run autoconstructor runner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # if you want OpenAI usage, set OPENAI_API_KEY in repo secrets
        run: |
          python autoconstructor/runner.py --repo "srodolfobarbosa-afk/Nexo" --file "autoconstructor/agent_output.txt" --intent "Periodic autonomous update"
