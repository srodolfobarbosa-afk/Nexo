name: PR Auto Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  test-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -q || exit 1

      - name: Auto-merge if agent PR
        if: github.event.pull_request.user.login == 'github-actions[bot]' || contains(github.event.pull_request.user.login, 'auto')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Merging PR ${{ github.event.pull_request.html_url }}"
          gh pr merge ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --merge --admin
