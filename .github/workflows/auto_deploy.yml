name: Auto Deploy Nexo
permissions:
  contents: read

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: test # Depende do job 'test' do workflow de CI
    environment: production # Requer aprovação manual se ambiente protegido

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install render-cli || true

      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then echo "RENDER_API_KEY not set"; exit 1; fi
          render deploy --service srv-d33s9djuibrs73asirgg --api-key $RENDER_API_KEY
