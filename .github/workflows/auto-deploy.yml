name: Auto Deploy Nexo

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          # criar virtualenv fora do repositório para evitar que linters analisem 'venv' dentro do repo
          VENV_DIR="$RUNNER_TEMP/venv"
          python -m venv "$VENV_DIR"
          source "$VENV_DIR/bin/activate"
          pip install -r requirements.txt

      - name: Install flake8
        run: |
          source "$RUNNER_TEMP/venv/bin/activate"
          pip install flake8

      - name: Run lint
        run: |
          source "$RUNNER_TEMP/venv/bin/activate"
          # O virtualenv foi criado em $RUNNER_TEMP; adicionar exclusões adicionais por segurança
          flake8 . --exclude=venv,.venv,$RUNNER_TEMP --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --exclude=venv,.venv,$RUNNER_TEMP --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run tests
        run: |
          source venv/bin/activate
          pytest tests/

      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          pip install render-cli
          source venv/bin/activate
          render deploy --service srv-d33s9djuibrs73asirgg --api-key $RENDER_API_KEY
