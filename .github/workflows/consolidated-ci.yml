name: Consolidated CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_dev.txt
      - name: Lint (ruff)
        run: |
          ruff check .
      - name: Format check (black/isort)
        run: |
          black --check .
          isort --check-only .
      - name: Run tests
        run: |
          pytest -q

  build-and-dockerize:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: nexo:latest

  deploy-preview:
    runs-on: ubuntu-latest
    needs: build-and-dockerize
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Render (optional)
        if: ${{ secrets.RENDER_SERVICE_ID && secrets.RENDER_API_KEY }}
        run: |
          curl -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" -H "Content-Type: application/json" -d '{}'
      - name: Create image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: |
            ./
