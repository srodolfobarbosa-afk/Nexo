name: CI Minimal

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          if [ -f requirements_dev.txt ]; then pip install -r requirements_dev.txt || true; fi

      - name: Lint (ruff)
        run: |
          python -m pip install ruff
          ruff check . || true

      - name: Run tests
        run: |
          pytest -q || true

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build -t nexo:${{ github.sha }} .
