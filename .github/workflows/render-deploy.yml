name: Render Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image to GHCR
        id: build-image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Trigger Render deploy
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
          IMAGE_URL: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          if [ -z "$RENDER_SERVICE_ID" ] || [ -z "$RENDER_API_TOKEN" ]; then
            echo "Render secrets not set. Skipping deploy.";
            exit 0;
          fi
          echo "Triggering Render deploy for service $RENDER_SERVICE_ID using image $IMAGE_URL"
          # Trigger a deploy via Render API. If your Render service is configured to deploy from a registry image,
          # you can instead update the service to point to IMAGE_URL. Here we request a fresh deploy (Render will
          # use the repo/build settings configured in dashboard if applicable).
          curl -s -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":true}' | jq . || true
