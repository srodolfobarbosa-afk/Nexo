name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements_clean.txt ]; then pip install -r requirements_clean.txt; else pip install -r requirements.txt; fi
      - name: Run linters
        run: |
          python -m pip install ruff black isort
          python -m ruff check . || true
          python -m isort --check-only . || true
          python -m black --check . || true
      - name: Run tests
        run: |
          pytest -q
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_dev.txt
      - name: Run tests
        run: |
          export PYTHONPATH=$(pwd)
          pytest -q
      - name: Run ruff (lint)
        run: |
          python -m pip install ruff
          ruff check .
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security_check:
    name: Security / Secrets check
    runs-on: ubuntu-latest
    outputs:
      secrets_ok: ${{ steps.check.outputs.secrets_ok }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets
        id: check
        run: |
          missing=0
          for s in SUPABASE_URL SUPABASE_KEY OPENAI_API_KEY; do
            if [ -z "${{ secrets[$s] }}" ]; then
              echo "Secret $s is missing"
              missing=1
            else
              echo "Secret $s present"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "secrets_ok=false" >> $GITHUB_OUTPUT
            echo "One or more required secrets are missing. Failing security check."
            exit 1
          else
            echo "secrets_ok=true" >> $GITHUB_OUTPUT
          fi

  test_and_lint:
    name: Tests and Lint
    runs-on: ubuntu-latest
    needs: security_check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Run lint (flake8)
        run: |
          # evitar linting de virtualenvs e de diretórios temporários do runner
          flake8 --max-line-length=120 --exclude=venv,.venv,$RUNNER_TEMP

      - name: Run tests
        run: |
          pytest -q
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pre-flight secret scan
        run: |
          pip install detect-secrets
          detect-secrets scan > .secrets.scan || true
          if [ -s .secrets.scan ]; then
            echo "Potential secrets found:" >&2
            sed -n '1,200p' .secrets.scan >&2
            exit 1
          fi

      - name: Run unit tests (sandboxed)
        env:
          PYTHONWARNINGS: default
        run: |
          pip install pytest
          mkdir -p tmp/sandbox
          # Run pytest and save logs; fail the job if tests fail
          pytest -q --maxfail=1 | tee tmp/sandbox/pytest.log
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # instalar o package em modo editável para evitar manipular PYTHONPATH
          pip install -e .
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q
      - name: Lint (ruff)
        run: |
          python -m pip install ruff
          ruff check .
  sandbox:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create venv and run sandbox runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
          python tooling/sandbox_runner.py
      - name: Upload sandbox logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-logs
          path: construction_logs/
