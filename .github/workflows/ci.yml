name: CI

on:
  push:
    name: CI

    on:
      push:
        branches: [ main, autonomy/bootstrap ]
      pull_request:
        branches: [ main ]

    jobs:
      codeql:
        name: CodeQL Scan
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v4

          - name: Initialize CodeQL
            uses: github/codeql-action/init@v2
            with:
              languages: python

          - name: Autobuild
            uses: github/codeql-action/autobuild@v2

          - name: Perform CodeQL analysis
            uses: github/codeql-action/analyze@v2

      security_check:
        name: Security / Secrets check
        runs-on: ubuntu-latest
        outputs:
          secrets_ok: ${{ steps.check.outputs.secrets_ok }}
        steps:
          - name: Checkout
            uses: actions/checkout@v4

          - name: Check required secrets
            id: check
            run: |
              missing=0
              for s in SUPABASE_URL SUPABASE_KEY OPENAI_API_KEY; do
                if [ -z "${{ secrets[$s] }}" ]; then
                  echo "Secret $s is missing"
                  missing=1
                else
                  echo "Secret $s present"
                fi
              done
              if [ "$missing" -ne 0 ]; then
                echo "secrets_ok=false" >> $GITHUB_OUTPUT
                echo "One or more required secrets are missing. Failing security check."
                exit 1
              else
                echo "secrets_ok=true" >> $GITHUB_OUTPUT
              fi

      test:
        name: Tests and Lint
        runs-on: ubuntu-latest
        needs: security_check
        steps:
          - name: Checkout
            uses: actions/checkout@v4

          - name: Set up Python 3.12
            uses: actions/setup-python@v4
            with:
              python-version: '3.12'

          - name: Install dependencies
            run: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              pip install -e . || true

          - name: Run tests
            run: |
              pytest -q

          - name: Run linters
            run: |
              python -m pip install ruff flake8
              ruff check . || true
              flake8 --max-line-length=120 || true
        run: |
