name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # instalar o package em modo editável para evitar manipular PYTHONPATH
          pip install -e .
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q
      - name: Lint (ruff)
        run: |
          python -m pip install ruff
          ruff check .
  sandbox:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create venv and run sandbox runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
          python tooling/sandbox_runner.py
      - name: Upload sandbox logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-logs
          path: construction_logs/
