name: Flake8 Verbose Debug

on:
  workflow_dispatch:

jobs:
  flake8-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Create venv in runner temp
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          source "$RUNNER_TEMP/venv/bin/activate"
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install flake8

      - name: Run flake8 verbose
        id: lint
        run: |
          source "$RUNNER_TEMP/venv/bin/activate"
          set -o pipefail
          # rodar flake8 em modo verbose e capturar saída completa
          flake8 . --exclude=venv,.venv,$RUNNER_TEMP --count --select=E9,F63,F7,F82 --show-source --statistics -v 2>&1 | tee flake8-verbose.log || true

      - name: Upload flake8 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flake8-verbose-log
          path: flake8-verbose.log
