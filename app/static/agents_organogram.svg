<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <style>
    .box { fill:#f4f6f8; stroke:#334155; stroke-width:2; rx:8; }
    .title { font: bold 14px sans-serif; fill:#0f172a }
    .label { font: 12px sans-serif; fill:#0f172a }
    .link { stroke:#94a3b8; stroke-width:2; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Núcleo Criador -->
  <rect x="50" y="40" width="220" height="80" class="box"/>
  <text x="60" y="65" class="title">EcoGenesis (Thalles)</text>
  <text x="60" y="85" class="label">Criador / Orquestrador</text>

  <rect x="50" y="140" width="220" height="80" class="box"/>
  <text x="60" y="165" class="title">Theo</text>
  <text x="60" y="185" class="label">Memória de longo prazo</text>

  <!-- Linha Técnica -->
  <rect x="350" y="20" width="220" height="80" class="box"/>
  <text x="360" y="45" class="title">Architect</text>
  <text x="360" y="65" class="label">Planejamento técnico</text>

  <rect x="350" y="120" width="220" height="80" class="box"/>
  <text x="360" y="145" class="title">Coder</text>
  <text x="360" y="165" class="label">Implementação</text>

  <rect x="350" y="220" width="220" height="80" class="box"/>
  <text x="360" y="245" class="title">Reviewer</text>
  <text x="360" y="265" class="label">Revisão qualidade</text>

  <rect x="350" y="320" width="220" height="80" class="box"/>
  <text x="360" y="345" class="title">Tester</text>
  <text x="360" y="365" class="label">Testes</text>

  <rect x="350" y="420" width="220" height="80" class="box"/>
  <text x="360" y="445" class="title">Deployer</text>
  <text x="360" y="465" class="label">Deploy &amp; Ops</text>

  <!-- Operações -->
  <rect x="700" y="40" width="220" height="80" class="box"/>
  <text x="710" y="65" class="title">Finance</text>
  <text x="710" y="85" class="label">Controle financeiro</text>

  <rect x="700" y="140" width="220" height="80" class="box"/>
  <text x="710" y="165" class="title">Marketing</text>
  <text x="710" y="185" class="label">Campanhas</text>

  <rect x="700" y="240" width="220" height="80" class="box"/>
  <text x="710" y="265" class="title">Community</text>
  <text x="710" y="285" class="label">Suporte &amp; Feedback</text>

  <rect x="700" y="340" width="220" height="80" class="box"/>
  <text x="710" y="365" class="title">Security</text>
  <text x="710" y="385" class="label">Proteção</text>

  <!-- Crescimento -->
  <rect x="50" y="320" width="220" height="80" class="box"/>
  <text x="60" y="345" class="title">Research</text>
  <text x="60" y="365" class="label">Pesquisa tecnológica</text>

  <rect x="50" y="420" width="220" height="80" class="box"/>
  <text x="60" y="445" class="title">Innovation</text>
  <text x="60" y="465" class="label">Protótipos &amp; Ideias</text>

  <!-- Links -->
  <line x1="270" y1="80" x2="350" y2="60" class="link" />
  <line x1="170" y1="180" x2="350" y2="140" class="link" />

  <line x1="570" y1="60" x2="700" y2="80" class="link" />
  <line x1="570" y1="160" x2="700" y2="160" class="link" />
  <line x1="570" y1="260" x2="700" y2="260" class="link" />

  <line x1="170" y1="360" x2="350" y2="350" class="link" />
  <line x1="170" y1="460" x2="350" y2="430" class="link" />

</svg>
